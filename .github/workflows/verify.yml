name: Verify site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate the site from data
        run: python3 build/build.py

      - name: Fail if generated HTML differs from the committed HTML
        run: |
          if ! git diff --quiet -- '*.html'; then
            echo "::error::Committed HTML is out of date with data/. Run 'python3 build/build.py' and commit."
            git diff --stat -- '*.html'
            exit 1
          fi
          echo "Generated HTML matches the committed files."

      - name: Run the verification suite
        run: python3 tools/check_site.py

      - name: Regenerate the integrated dashboard from hub/data.json
        run: python3 hub/build.py

      - name: Fail if index.html or hub/*.html differ from the committed pages
        run: |
          if ! git diff --quiet -- index.html hub/; then
            echo "::error::Committed dashboard HTML is out of date with hub/data.json. Run 'python3 hub/build.py' and commit."
            git diff --stat -- index.html hub/
            exit 1
          fi
          echo "Dashboard HTML matches hub/data.json."

      - name: Verify the integrated dashboard line by line
        run: python3 tools/verify_hub.py

      # ---- independent re-verification record (verification/) ----
      - name: Regenerate the independent verification record
        run: python3 verification/build.py

      - name: Fail if verification/*.html differ from the committed pages
        run: |
          if ! git diff --quiet -- verification/; then
            echo "::error::Committed verification HTML is out of date with verification/data.json. Run 'python3 verification/build.py' and commit."
            git diff --stat -- verification/
            exit 1
          fi
          echo "Verification record matches verification/data.json."

      - name: Verify the independent record line by line
        run: python3 tools/verify_independent.py
